settings:
  concurrency: 10          # 并发数，建议 10-30
  timeout: 5              # 单次请求超时（秒）
  # user_agent: "自定义UA（可选）"

targets:
  # 推荐：显式写模板，最可靠
  - name: "站点A"
    base_url: "http://45.192.97.170:8880/play/70.m3u8"
    template: "http://45.192.97.170:8880/play/{id}.m3u8"
    start: 70
    end: 70

  # 简洁：指出替换第几段数字（排除IP/端口）
  # - name: "站点B"
  #   base_url: "http://another.com/2024/iptv/88.m3u8"
  #   id_segment: 2
  #   start: 1
  #   end: 200

  # 高级：正则定位 + 需要 Referer
  # - name: "站点C"
