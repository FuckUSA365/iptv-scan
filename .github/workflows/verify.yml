name: M3U Playlist Verifier

on:
  workflow_dispatch:
    inputs:
      input:
        description: '输入源（本地路径或 http(s) URL）'
        required: true
        default: 'output/playlist.m3u'
        type: string
      strict:
        description: '严格模式（只保留分片级验证通过的）'
        type: boolean
        default: true
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install aiohttp

      - name: 运行验证
        run: |
          INPUT="${{ github.event.inputs.input }}"
          if [ -z "$INPUT" ]; then
            INPUT="output/playlist.m3u"
          fi
          STRICT_FLAG=""
          if [ "${{ github.event.inputs.strict }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          python verify_m3u.py \
            --input "$INPUT" \
            --output output/verified.m3u \
            --report output/verify_report.json \
            --concurrency 15 \
            $STRICT_FLAG

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: verified-m3u-${{ github.run_number }}
          path: |
            output/verified.m3u
            output/verify_report.json
          retention-days: 30

      - name: 提交结果回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "结果无变化"
          else
            git commit -m "验证结果 $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
